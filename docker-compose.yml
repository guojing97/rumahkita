# ==============================================================================
# RumahKita – docker-compose.yml
#
# Menjalankan tiga layanan aplikasi:
#   api    → NestJS REST API        (port 4000)
#   web    → Next.js Frontend       (port 3001)
#   worker → Notification Worker    (background daemon)
#
# PostgreSQL TIDAK dimasukkan di sini karena menggunakan server eksternal.
# Atur DATABASE_URL di file .env sesuai kredensial server PostgreSQL Anda.
# ==============================================================================

name: rumahkita

services:
  # ----------------------------------------------------------------------------
  # API – NestJS REST Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rumahkita-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-4000}:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 4000
      API_PREFIX: ${API_PREFIX:-api/v1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rumahkita-network

  # ----------------------------------------------------------------------------
  # Web – Next.js Frontend (BFF Proxy included)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    container_name: rumahkita-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3001}:3001'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      INTERNAL_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rumahkita-network

  # ----------------------------------------------------------------------------
  # Worker – Notification Outbox Daemon
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: rumahkita-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-5}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rumahkita-network

networks:
  rumahkita-network:
    name: rumahkita-network
    driver: bridge
